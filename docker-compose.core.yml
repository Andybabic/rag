# ══════════════════════════════════════════════════════════════
# Server A – Core Pipeline
# Cleaning, Data Structure, Embedding, VectorDB, Qdrant
# ══════════════════════════════════════════════════════════════

services:

  # ── Infrastructure ────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:v1.9.7
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Application Services ──────────────────────────────────

  cleaning:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/cleaning
        SERVICE_PORT: "8001"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      USE_MINERU: "${USE_MINERU:-false}"
      MINERU_API_URL: "${MINERU_API_URL:-http://mineru:8000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  data_structure:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/data_structure
        SERVICE_PORT: "8002"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      DEFAULT_CHUNK_SIZE: "${DEFAULT_CHUNK_SIZE:-512}"
      DEFAULT_CHUNK_OVERLAP: "${DEFAULT_CHUNK_OVERLAP:-64}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  embedding:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/embedding
        SERVICE_PORT: "8003"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:?OLLAMA_BASE_URL muss gesetzt sein (z.B. http://server-b:11434)}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-bge-m3}"
      EMBED_BATCH_SIZE: "${EMBED_BATCH_SIZE:-50}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  vectordb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/vectordb
        SERVICE_PORT: "8004"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    environment:
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - core
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  core:
    driver: bridge

volumes:
  qdrant_data:
