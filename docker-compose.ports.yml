# ══════════════════════════════════════════════════════════════
# Single-Server Hosting – mit Host-Port-Bindings (.env: *_PORT)
# ══════════════════════════════════════════════════════════════
#
# Wie docker-compose.build.yml, aber Services sind auf localhost erreichbar.
# Port-Nummern werden in .env gesetzt (POSTGRES_PORT, FRONTEND_PORT, …).
#
# Fuer rein internes Netzwerk ohne Host-Ports: BIND_PORTS=false und
#   docker compose -f docker-compose.build.yml up
# oder: make up (Makefile liest BIND_PORTS aus .env).
#
# Persistente Daten: KERMIT_DATA_DIR (Default /home/kermit)
# ══════════════════════════════════════════════════════════════

services:

  # ── Infrastructure ────────────────────────────────────────

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragplatform}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${KERMIT_DATA_DIR:-/home/kermit}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-ragplatform}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    build:
      context: .
      dockerfile: Dockerfile.qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - ${KERMIT_DATA_DIR:-/home/kermit}/qdrant:/var/lib/qdrant
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ${KERMIT_DATA_DIR:-/home/kermit}/ollama:/root/.ollama
  #   profiles:
  #     - local-ollama

  # ── Application Services ──────────────────────────────────

  cleaning:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/cleaning
        SERVICE_PORT: "8001"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "${CLEANING_PORT:-8001}:8001"
    volumes:
      - ${KERMIT_DATA_DIR:-/home/kermit}/documents:/data/documents
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  data_structure:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/data_structure
        SERVICE_PORT: "8002"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    ports:
      - "${DATA_STRUCTURE_PORT:-8002}:8002"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  embedding:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/embedding
        SERVICE_PORT: "8003"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    ports:
      - "${EMBEDDING_PORT:-8003}:8003"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  vectordb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/vectordb
        SERVICE_PORT: "8004"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8004
    ports:
      - "${VECTORDB_PORT:-8004}:8004"
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  evaluation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/evaluation
        SERVICE_PORT: "8005"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8005
    ports:
      - "${EVALUATION_PORT:-8005}:8005"
    volumes:
      - ${KERMIT_DATA_DIR:-/home/kermit}/hf-cache:/home/appuser/.cache
    environment:
      HF_HOME: /home/appuser/.cache/huggingface
      TRANSFORMERS_CACHE: /home/appuser/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /home/appuser/.cache/sentence-transformers
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    command: node build/index.js
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      ORIGIN: "${ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}"
      BODY_SIZE_LIMIT: "52428800"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET muss gesetzt sein (Cookie-Signatur; python -c \"import secrets; print(secrets.token_urlsafe(48))\")}"
      EVALUATION_SERVICE_URL: "${EVALUATION_SERVICE_URL:-http://evaluation:8005}"
      CLEANING_SERVICE_URL: "${CLEANING_SERVICE_URL:-http://cleaning:8001}"
      DATA_STRUCTURE_SERVICE_URL: "${DATA_STRUCTURE_SERVICE_URL:-http://data_structure:8002}"
      EMBEDDING_SERVICE_URL: "${EMBEDDING_SERVICE_URL:-http://embedding:8003}"
      VECTORDB_SERVICE_URL: "${VECTORDB_SERVICE_URL:-http://vectordb:8004}"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      cleaning:
        condition: service_healthy
      data_structure:
        condition: service_healthy
      embedding:
        condition: service_healthy
      vectordb:
        condition: service_healthy
      evaluation:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
