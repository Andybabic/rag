services:

  # ── Infrastructure ────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragplatform}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-ragplatform}"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-ollama

  # ── Application Services ──────────────────────────────────────

  cleaning:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/cleaning
        SERVICE_PORT: "8001"
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./services/cleaning:/app
      - ./shared:/shared
      # Bind-mount statt named volume: Dokumente + Bilder liegen im Repo
      # unter ./data/documents und sind direkt via Finder/Explorer
      # erreichbar (z.B. um <image_id>.txt / .json zu inspizieren).
      - ./data/documents:/data/documents
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5:14b}
    depends_on:
      postgres:
        condition: service_healthy

  data_structure:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/data_structure
        SERVICE_PORT: "8002"
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - ./services/data_structure:/app
      - ./shared:/shared
    ports:
      - "8002:8002"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  embedding:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/embedding
        SERVICE_PORT: "8003"
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload
    volumes:
      - ./services/embedding:/app
      - ./shared:/shared
    ports:
      - "8003:8003"
    env_file: .env

  vectordb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/vectordb
        SERVICE_PORT: "8004"
    command: uvicorn main:app --host 0.0.0.0 --port 8004 --reload
    volumes:
      - ./services/vectordb:/app
      - ./shared:/shared
    ports:
      - "8004:8004"
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy

  evaluation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/evaluation
        SERVICE_PORT: "8005"
    command: uvicorn main:app --host 0.0.0.0 --port 8005 --reload
    volumes:
      - ./services/evaluation:/app
      - ./shared:/shared
    ports:
      - "8005:8005"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command: node build/index.js
    volumes:
      - ./services/frontend/build:/app/build
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ORIGIN: "http://localhost:3000"
      BODY_SIZE_LIMIT: "52428800"
    env_file: .env
    depends_on:
      evaluation:
        condition: service_started

  # ── Integration Tests ───────────────────────────────────────────

  integration-test:
    build:
      context: .
      dockerfile: services/integration/Dockerfile
    env_file: .env
    depends_on:
      cleaning:
        condition: service_started
      data_structure:
        condition: service_started
      embedding:
        condition: service_started
      vectordb:
        condition: service_started
      evaluation:
        condition: service_started
      frontend:
        condition: service_started
    profiles:
      - test

volumes:
  pgdata:
  qdrant_data:
  ollama_data:
