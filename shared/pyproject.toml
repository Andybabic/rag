[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Shared models, errors, and tracing for the RAG platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "starlette>=0.27",
    "cryptography>=42.0",
    "asyncpg>=0.29",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "openinference-instrumentation>=0.1.0",
    "openinference-semantic-conventions>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
    "anyio[trio]",
]

[tool.setuptools.packages.find]
include = ["shared*"]
