# ══════════════════════════════════════════════════════════════
# Server C – Frontend + PostgreSQL
# SvelteKit Frontend, PostgreSQL Database
# ══════════════════════════════════════════════════════════════

services:

  # ── Infrastructure ────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ragplatform}"
      POSTGRES_USER: "${POSTGRES_USER:-rag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Application Services ──────────────────────────────────

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    command: node build/index.js
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET muss gesetzt sein (Cookie-Signatur; python -c \"import secrets; print(secrets.token_urlsafe(48))\")}"
      EVALUATION_SERVICE_URL: "${EVALUATION_SERVICE_URL:?EVALUATION_SERVICE_URL muss gesetzt sein (z.B. http://server-b:8005)}"
      CLEANING_SERVICE_URL: "${CLEANING_SERVICE_URL:?CLEANING_SERVICE_URL muss gesetzt sein (z.B. http://server-a:8001)}"
      DATA_STRUCTURE_SERVICE_URL: "${DATA_STRUCTURE_SERVICE_URL:?DATA_STRUCTURE_SERVICE_URL muss gesetzt sein (z.B. http://server-a:8002)}"
      EMBEDDING_SERVICE_URL: "${EMBEDDING_SERVICE_URL:?EMBEDDING_SERVICE_URL muss gesetzt sein (z.B. http://server-a:8003)}"
      VECTORDB_SERVICE_URL: "${VECTORDB_SERVICE_URL:?VECTORDB_SERVICE_URL muss gesetzt sein (z.B. http://server-a:8004)}"
    networks:
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  frontend:
    driver: bridge

volumes:
  pgdata:
